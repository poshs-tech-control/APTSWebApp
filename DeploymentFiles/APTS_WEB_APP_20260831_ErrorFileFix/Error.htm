<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Error - Ayasto Pallet Tracking System</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f8fb;
            color: #1f2937;
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            box-sizing: border-box;
        }

        section {
            max-width: 460px;
            width: 100%;
            background: #fff;
            border: 1px solid #d9e1ec;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 26px;
            font-weight: 700;
        }

        p {
            margin: 0 0 24px;
            line-height: 1.5;
            color: #526070;
        }

        a {
            display: inline-block;
            padding: 11px 20px;
            border-radius: 6px;
            background: #0b5ed7;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Something went wrong</h1>
            <p>We could not complete your request. Please return to the login page and try again.</p>
            <a href="/Home/Login">Back to Login</a>
        </section>
    </main>

</html>
